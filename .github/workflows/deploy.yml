name: Build question bank & deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Excel -> JSON (only if Excel files exist)
        run: |
          pip install openpyxl
          if ls tools/*.xlsx >/dev/null 2>&1; then python tools/excel_to_json.py; fi
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js data .nojekyll _site/
          if [ -d images ]; then cp -r images _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
